<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireGuard Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<!-- 60% Primary Color: bg-white -->
<body class="bg-white text-gray-800 min-h-screen">
    
    <!-- Navbar (30% Secondary: bg-orange-50) -->
    <nav class="bg-orange-50 border-b border-orange-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <!-- 10% Tertiary/Accent: bg-orange-500 -->
            <div class="w-3 h-3 bg-orange-500 rounded-full animate-pulse"></div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-wide">
                Fire<span class="text-orange-500">Guard</span> Dashboard
            </h1>
        </div>
        <div id="connectionStatus" class="px-4 py-1.5 rounded-full text-sm font-semibold bg-white text-orange-500 border border-orange-300 shadow-sm">
            CONNECTING...
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-6 max-w-7xl mx-auto space-y-6">
        
        <!-- Top Indicator Cards (30% Secondary: bg-orange-50) -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            
            <div class="bg-orange-50 p-4 rounded-xl border border-orange-100 shadow-sm">
                <p class="text-gray-500 text-sm font-semibold mb-1">Temperature</p>
                <div class="flex items-end gap-1">
                    <span id="valTemp" class="text-3xl font-bold text-orange-500">0.0</span>
                    <span class="text-gray-400 font-medium mb-1">°C</span>
                </div>
            </div>
            
            <div class="bg-orange-50 p-4 rounded-xl border border-orange-100 shadow-sm">
                <p class="text-gray-500 text-sm font-semibold mb-1">Humidity</p>
                <div class="flex items-end gap-1">
                    <span id="valHum" class="text-3xl font-bold text-orange-500">0.0</span>
                    <span class="text-gray-400 font-medium mb-1">%</span>
                </div>
            </div>

            <div class="bg-orange-50 p-4 rounded-xl border border-orange-100 shadow-sm flex flex-col justify-between">
                <p class="text-gray-500 text-sm font-semibold">Flame Sensor</p>
                <div id="valFlame" class="text-lg font-bold text-emerald-600 mt-2">✅ CLEAR</div>
            </div>

            <div class="bg-orange-50 p-4 rounded-xl border border-orange-100 shadow-sm flex flex-col justify-between">
                <p class="text-gray-500 text-sm font-semibold">Suppress Valve</p>
                <div id="valValve" class="text-lg font-bold text-gray-600 mt-2">🔒 CLOSED</div>
            </div>

            <div class="bg-orange-50 p-4 rounded-xl border border-orange-100 shadow-sm flex flex-col justify-between">
                <p class="text-gray-500 text-sm font-semibold">Alarm Buzzer</p>
                <div id="valBuzzer" class="text-lg font-bold text-gray-600 mt-2">🔇 OFF</div>
            </div>
        </div>

        <!-- 4 Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Chart 1: Smoke Density -->
            <div class="bg-orange-50 p-5 rounded-xl border border-orange-100 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-md font-bold text-gray-700">Smoke Density Trend</h2>
                    <span class="text-xl font-bold text-orange-500" id="valSmokeCard">0.0%</span>
                </div>
                <div class="relative h-[250px] w-full">
                    <canvas id="smokeChart"></canvas>
                </div>
            </div>

            <!-- Chart 2: Temperature -->
            <div class="bg-orange-50 p-5 rounded-xl border border-orange-100 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-md font-bold text-gray-700">Temperature Trend</h2>
                </div>
                <div class="relative h-[250px] w-full">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>

            <!-- Chart 3: Humidity -->
            <div class="bg-orange-50 p-5 rounded-xl border border-orange-100 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-md font-bold text-gray-700">Humidity Trend</h2>
                </div>
                <div class="relative h-[250px] w-full">
                    <canvas id="humChart"></canvas>
                </div>
            </div>

            <!-- Chart 4: Current Overview (Bar) -->
            <div class="bg-orange-50 p-5 rounded-xl border border-orange-100 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-md font-bold text-gray-700">Live Metrics Comparison</h2>
                </div>
                <div class="relative h-[250px] w-full">
                    <canvas id="overviewChart"></canvas>
                </div>
            </div>

        </div>
    </main>

    <script>
    const maxDataPoints = 30;
    
    // --- KONFIGURASI WARNA TEMA ---
    const colorAccent = '#f97316'; // orange-500 (10%)
    const colorFill = 'rgba(255, 237, 213, 0.6)'; // orange-50 (30%)
    const colorGrid = 'rgba(0, 0, 0, 0.05)';
    const colorText = '#6b7280'; // gray-500

    // Fungsi Helper untuk membuat Line Chart Real-Time
    function createLineChart(ctxId, label, yMax) {
        const ctx = document.getElementById(ctxId).getContext('2d');
        return new Chart(ctx, {
            type: 'line',
            data: {
                // Inisialisasi awal dengan label kosong
                labels: Array(maxDataPoints).fill(''),
                datasets: [{
                    label: label,
                    data: Array(maxDataPoints).fill(0),
                    borderColor: colorAccent,
                    backgroundColor: colorFill,
                    borderWidth: 2,
                    pointRadius: 1, // Diberi nilai 1 agar ada titik fisik yang bisa di-hover
                    pointHoverRadius: 6,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    y: { 
                        beginAtZero: true, 
                        max: yMax,
                        grid: { color: colorGrid },
                        ticks: { color: colorText }
                    },
                    x: { 
                        grid: { display: false },
                        ticks: { display: false } // Sembunyikan label di sumbu X agar UI tetap bersih
                    }
                },
                plugins: { 
                    legend: { display: false },
                    tooltip: {
                        enabled: true,
                        displayColors: false, // Menghilangkan kotak warna di dalam tooltip
                        callbacks: {
                            // Menambahkan satuan pada label tooltip
                            label: function(context) {
                                let unit = (label === 'Temperature' ? ' °C' : ' %');
                                return context.dataset.label + ': ' + context.parsed.y + unit;
                            }
                        }
                    } 
                }
            }
        });
    }

    // Inisialisasi 3 Line Charts
    const smokeChart = createLineChart('smokeChart', 'Smoke Density', 100);
    const tempChart = createLineChart('tempChart', 'Temperature', 100);
    const humChart = createLineChart('humChart', 'Humidity', 100);

    // Inisialisasi Chart ke-4 (Bar Chart untuk komparasi nilai aktual)
    const ctxBar = document.getElementById('overviewChart').getContext('2d');
    const overviewChart = new Chart(ctxBar, {
        type: 'bar',
        data: {
            labels: ['Temperature (°C)', 'Humidity (%)', 'Smoke Density (%)'],
            datasets: [{
                label: 'Current Value',
                data: [0, 0, 0],
                backgroundColor: [
                    'rgba(249, 115, 22, 0.8)', 
                    'rgba(249, 115, 22, 0.6)', 
                    'rgba(249, 115, 22, 0.4)'  
                ],
                borderColor: colorAccent,
                borderWidth: 1,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 0 },
            scales: {
                y: { 
                    beginAtZero: true, max: 100,
                    grid: { color: colorGrid },
                    ticks: { color: colorText }
                },
                x: { 
                    grid: { display: false },
                    ticks: { color: colorText, font: {weight: '600'} }
                }
            },
            plugins: { legend: { display: false } }
        }
    });

    // --- Socket.IO Connection & Data Handling ---
    const socket = io();

    socket.on('update_data', function(data) {
        // 1. Update Teks Indikator Card
        document.getElementById('connectionStatus').innerText = data.state_name;
        document.getElementById('valTemp').innerText = data.temperature.toFixed(1);
        document.getElementById('valHum').innerText = data.humidity.toFixed(1);
        document.getElementById('valSmokeCard').innerText = data.smoke_pct.toFixed(1) + "%";

        const flameEl = document.getElementById('valFlame');
        if(data.flame_detected) {
            flameEl.innerHTML = "🔥 DETECTED!";
            flameEl.className = "text-lg font-bold text-red-600 mt-2 animate-pulse";
        } else {
            flameEl.innerHTML = "✅ CLEAR";
            flameEl.className = "text-lg font-bold text-emerald-600 mt-2";
        }

        const valveEl = document.getElementById('valValve');
        if(data.suppression_valve) {
            valveEl.innerHTML = "💧 OPEN (ACTIVE)";
            valveEl.className = "text-lg font-bold text-blue-600 mt-2";
        } else {
            valveEl.innerHTML = "🔒 CLOSED";
            valveEl.className = "text-lg font-bold text-gray-600 mt-2";
        }

        const buzzerEl = document.getElementById('valBuzzer');
        if(data.buzzer_active) {
            buzzerEl.innerHTML = "🚨 ALARMING";
            buzzerEl.className = "text-lg font-bold text-red-600 mt-2 animate-bounce";
        } else {
            buzzerEl.innerHTML = "🔇 OFF";
            buzzerEl.className = "text-lg font-bold text-gray-600 mt-2";
        }

        // Ambil waktu saat ini (HH:MM:SS) untuk dijadikan label sumbu X
        const now = new Date();
        const timeLabel = now.toLocaleTimeString('id-ID', { hour12: false });

        // 2. Fungsi Helper untuk Update Line Charts (Nilai + Label Waktu)
        function updateLineChart(chart, newValue, timestamp) {
            let chartData = chart.data.datasets[0].data;
            let chartLabels = chart.data.labels;

            // Masukkan data baru beserta timestamp-nya
            chartData.push(newValue);
            chartLabels.push(timestamp);

            // Geser (hapus data paling lama) jika melebihi maxDataPoints
            if (chartData.length > maxDataPoints) {
                chartData.shift();
                chartLabels.shift();
            }
            chart.update();
        }

        // Update 3 Line Charts
        updateLineChart(smokeChart, data.smoke_pct, timeLabel);
        updateLineChart(tempChart, data.temperature, timeLabel);
        updateLineChart(humChart, data.humidity, timeLabel);

        // 3. Update Bar Chart
        overviewChart.data.datasets[0].data = [data.temperature, data.humidity, data.smoke_pct];
        overviewChart.update();
    });
</script>
</body>
</html>
